name: Generar voz

on:
  push:
    branches: [main]
    paths: ["videos/lote-*/**.json", "tools/tts.py", ".github/workflows/voz.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voz
  cancel-in-progress: false

jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet num2words
      - name: Generar audios con ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p voz
          set -o pipefail
          python3 tools/tts.py 2>&1 | tee voz/registro.txt || echo "FALLO" >> voz/registro.txt
      - name: Guardar audios en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voz/ creditos.md
          if git diff --cached --quiet; then echo "Sin audios nuevos"; exit 0; fi
          git commit -m "Voz generada"
          git pull --rebase origin main
          git push origin main
